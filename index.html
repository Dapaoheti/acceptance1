<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0e0c;color:#ece6d8;min-height:100vh;overflow-x:hidden}
#wrap{max-width:800px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:50;background:rgba(15,14,12,.95);border-bottom:1px solid rgba(212,168,67,.15);padding:12px 16px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:1.1rem;font-weight:700;color:#d4a843;flex:1}
.topbar .backbtn{background:none;border:1px solid rgba(212,168,67,.15);color:#a8a090;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:1.1rem}
.page{display:none;padding:16px}.page.on{display:block}
.homebox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:30px;text-align:center;padding:20px}
.homebox .icon{font-size:3rem}.homebox .title{font-size:1.8rem;font-weight:900;color:#d4a843}.homebox .sub{font-size:.85rem;color:#a8a090;margin-top:4px}
.homebox .btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.btn{font-family:inherit;border:none;border-radius:12px;cursor:pointer;font-size:.95rem;font-weight:600;padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}.btn-gold{background:#d4a843;color:#0f0e0c}
.btn-gray{background:#2a2723;color:#ece6d8;border:1px solid rgba(212,168,67,.15)}
.btn-green{background:#4a9e6e;color:#fff}.btn-sm{padding:10px 14px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.infobox{margin-bottom:16px;padding:14px 16px;background:#1c1a17;border:1px solid rgba(212,168,67,.15);border-radius:12px}
.infobox .projname{font-size:1.05rem;font-weight:700;color:#d4a843}
.progbox{margin-bottom:20px}.progrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.proglbl{font-size:.8rem;color:#a8a090}.progval{font-size:.8rem;font-weight:600;color:#d4a843}
.progbar{height:5px;background:#2a2723;border-radius:3px;overflow:hidden}
.progfill{height:100%;background:linear-gradient(90deg,#b8922e,#d4a843);border-radius:3px;transition:width .5s}
.itemlist{display:flex;flex-direction:column;gap:8px;padding-bottom:80px}
.itemrow{background:#1c1a17;border:1px solid rgba(212,168,67,.15);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.itemrow:active{transform:scale(.98);border-color:#d4a843}
.itemnum{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:600;flex-shrink:0}
.itemnum.st-p{background:#353230;color:#6e6858}.itemnum.st-a{background:rgba(201,138,62,.12);color:#c98a3e}
.itemnum.st-d{background:rgba(74,158,110,.12);color:#4a9e6e}
.itembody{flex:1;min-width:0}.itemname{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemmeta{font-size:.72rem;color:#6e6858;margin-top:2px}
.itemtag{font-size:.72rem;padding:2px 8px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.itemtag.st-p{background:#353230;color:#6e6858}.itemtag.st-a{background:rgba(201,138,62,.12);color:#c98a3e}
.itemtag.st-d{background:rgba(74,158,110,.12);color:#4a9e6e}.itemarr{color:#6e6858;font-size:.9rem;flex-shrink:0}
.bottombar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:800px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(15,14,12,.96);border-top:1px solid rgba(212,168,67,.15);z-index:40}
.bottombar .btn{width:100%}
.dtl{display:none;position:fixed;inset:0;z-index:80;background:#0f0e0c;flex-direction:column;overflow-y:auto}
.dtl.on{display:flex}
.dtl-top{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(212,168,67,.15);background:rgba(15,14,12,.98);position:sticky;top:0;z-index:2}
.dtl-top button{background:none;border:1px solid rgba(212,168,67,.15);color:#a8a090;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:1.1rem}
.dtl-title{font-size:1rem;font-weight:700;color:#d4a843;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtl-body{padding:16px;flex:1}
.dtl-foot{padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(212,168,67,.15);background:rgba(15,14,12,.98);position:sticky;bottom:0}
.dtl-footbtns{display:flex;gap:10px}.dtl-footbtns .btn{flex:1}
.fgroup{margin-bottom:20px}.fgroup-title{font-size:.85rem;font-weight:600;color:#a8a090;margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{background:#1c1a17;border:1px solid rgba(212,168,67,.15);border-radius:8px;padding:12px}
.fld-lbl{font-size:.72rem;color:#6e6858;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.fld-orig{color:#b8922e;font-size:.68rem}
.fld input{width:100%;background:transparent;border:none;color:#ece6d8;font-size:1rem;font-family:inherit;font-weight:600;outline:none;padding:0}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid rgba(212,168,67,.15);cursor:pointer}
.pcard img{width:100%;height:100%;object-fit:cover}
.pcard .pdel{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(192,80,80,.9);color:#fff;border:none;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pcard .pinfo{position:absolute;bottom:0;left:0;right:0;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:.6rem}
.pcard .pnum{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#d4a843;color:#000;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.sht{display:none;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}
.sht.on{display:flex}
.sht-body{width:100%;max-width:800px;background:#1c1a17;border-radius:16px 16px 0 0;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,10px));animation:su .25s}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sht-body h3{font-size:.9rem;color:#a8a090;text-align:center;margin-bottom:16px;font-weight:600}
.sht-opt{width:100%;padding:16px;border:none;border-radius:12px;background:#2a2723;color:#ece6d8;font-size:1rem;font-family:inherit;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px}
.sht-opt:active{background:#353230}
.sht-cancel{width:100%;padding:16px;border:none;border-radius:12px;background:transparent;color:#6e6858;font-size:1rem;font-family:inherit;font-weight:600;cursor:pointer;margin-top:6px}
.campage{display:none;position:fixed;inset:0;z-index:200;background:#000;flex-direction:column}.campage.on{display:flex}
.cam-vid{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:#000}
.cam-vid video{width:100%;height:100%;object-fit:cover}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10;transition:opacity .1s}.cam-flash.on{opacity:1}
.cam-top{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.cam-top button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cam-info{background:rgba(0,0,0,.6);color:#fff;padding:6px 14px;border-radius:20px;font-size:.8rem}
.cam-bot{padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom,10px));display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8)}
.cam-snap{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4);cursor:pointer;flex-shrink:0}
.cam-snap:active{transform:scale(.9)}
.vwp{display:none;position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.95);flex-direction:column;align-items:center;justify-content:center}
.vwp.on{display:flex}.vwp img{max-width:95vw;max-height:85vh;object-fit:contain;border-radius:8px}
.vwp-x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1}
.vwp-nav{position:absolute;bottom:30px;display:flex;gap:16px;z-index:1}
.vwp-nav button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vwp-ct{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:.85rem;z-index:1}
.mdl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px}
.mdl.on{display:flex}
.mdl-box{background:#1c1a17;border:1px solid rgba(212,168,67,.15);border-radius:16px;width:100%;max-width:380px}
.mdl-hd{padding:16px;border-bottom:1px solid rgba(212,168,67,.15);display:flex;justify-content:space-between;align-items:center}
.mdl-hd h3{font-size:1rem;font-weight:700;color:#d4a843}
.mdl-hd button{background:none;border:none;color:#6e6858;font-size:1.5rem;cursor:pointer;padding:4px 8px}
.mdl-bd{padding:16px;text-align:center}
.mdl-bd p{color:#a8a090;margin-bottom:4px;font-size:.9rem}.mdl-bd strong{color:#d4a843}
.mdl-acts{display:flex;gap:10px;justify-content:center;margin-top:16px}
.donepage{text-align:center;padding:40px 20px}
.donepage .dicon{font-size:3.5rem;margin-bottom:12px}
.donepage h2{font-size:1.2rem;font-weight:700;color:#4a9e6e;margin-bottom:6px}
.donepage p{color:#a8a090;margin-bottom:24px;font-size:.9rem}
.donepage .dbtns{display:flex;flex-direction:column;gap:10px;max-width:280px;margin:0 auto}
.pdfp{display:none;position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.92);flex-direction:column;align-items:center;justify-content:center;padding:20px}
.pdfp.on{display:flex}
.pdfp-body{background:#fff;max-width:95vw;max-height:65vh;overflow:auto;border-radius:8px;padding:20px}
.pdfp-btns{margin-top:16px;display:flex;gap:12px}
.ldbox{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.8);align-items:center;justify-content:center;flex-direction:column;gap:12px}
.ldbox.on{display:flex}
.ldspin{width:36px;height:36px;border:3px solid #353230;border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ldtext{color:#ece6d8;font-size:.9rem}
.tst{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#2a2723;color:#ece6d8;padding:10px 20px;border-radius:12px;font-size:.85rem;z-index:300;opacity:0;transition:all .3s;border:1px solid rgba(212,168,67,.15);white-space:nowrap;pointer-events:none;max-width:90vw;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="wrap">
<div class="topbar">
<button class="backbtn" id="btnBack" onclick="goHome()" style="display:none">&#8592;</button>
<h1 id="topTitle">JF费用验收</h1>
</div>
<div id="pgHome" class="page on">
<div class="homebox">
<div>
<div class="icon">&#128203;</div>
<h2 class="title">JF费用验收</h2>
<p class="sub">按报价单逐项验收 &middot; 避免遗漏</p>
</div>
<div class="btns">
<button class="btn btn-gold" id="btnImport" onclick="pickFile()">&#128229; 导入报价单</button>

</div>
</div>
</div>
<div id="pgList" class="page">
<div class="infobox"><div class="projname" id="projName"></div></div>
<div class="progbox">
<div class="progrow">
<span class="proglbl">验收进度</span>
<span class="progval" id="progVal">0/0</span>
</div>
<div class="progbar"><div class="progfill" id="progFill" style="width:0%"></div></div>
</div>
<div class="itemlist" id="itemList"></div>
<div class="bottombar">
<button class="btn btn-gold" id="btnGen" onclick="genPDF()" disabled>&#128196; 生成验收文件</button>
</div>
</div>
<div id="pgDone" class="page">
<div class="donepage">
<div class="dicon">&#9989;</div>
<h2>全部验收完毕</h2>
<p>所有报价事项已完成验收</p>
<div class="dbtns">
<button class="btn btn-green" onclick="genPDF()">&#128196; 生成验收文件</button>
<button class="btn btn-gray" onclick="goHome()">&#127968; 返回首页</button>
</div>
</div>
</div>
</div>

<div class="dtl" id="dtlPage">
<div class="dtl-top">
<button onclick="closeDtl()">&#8592;</button>
<div class="dtl-title" id="dtlTitle"></div>
</div>
<div class="dtl-body">
<div class="fgroup">
<div class="fgroup-title">&#128221; 报价信息（只读）</div>
<div class="fgrid">
<div class="fld"><div class="fld-lbl">报价数量</div><input type="text" id="inpOQ" readonly style="opacity:.6"></div>
<div class="fld"><div class="fld-lbl">报价单价(元)</div><input type="text" id="inpOP" readonly style="opacity:.6"></div>
</div>
<div class="fld" style="margin-top:10px"><div class="fld-lbl">报价金额(元)</div><input type="text" id="inpOA" readonly style="opacity:.6"></div>
</div>
<div class="fgroup">
<div class="fgroup-title">&#9989; 验收信息（可修改）</div>
<div class="fgrid">
<div class="fld"><div class="fld-lbl">验收数量</div><input type="number" id="inpAQ" inputmode="decimal" placeholder="输入实际数量"></div>
<div class="fld"><div class="fld-lbl">验收单价(元)</div><input type="number" id="inpAP" inputmode="decimal" placeholder="输入实际单价"></div>
</div>
<div class="fld" style="margin-top:10px"><div class="fld-lbl">验收金额(元) <span class="fld-orig" style="font-size:.65rem">= 数量 x 单价，可手动改</span></div><input type="number" id="inpAA" inputmode="decimal" placeholder="自动计算或手动输入"></div>
<div class="fld" style="margin-top:10px"><div class="fld-lbl">验收备注</div><input type="text" id="inpR" placeholder="输入备注信息"></div>

</div>
<div style="margin-bottom:14px"><button class="btn btn-gold btn-sm" onclick="openSheet()" style="width:100%">&#128247; 选择图片</button></div>
<div class="pgrid" id="phGrid"></div>
</div>
</div>
<div class="dtl-foot">
<div class="dtl-footbtns">
<button class="btn btn-gray" onclick="saveOnly()">&#128190; 仅保存</button>
<button class="btn btn-green" onclick="saveAccept()">&#9989; 保存并验收</button>
</div>
</div>
</div>

<div class="sht" id="pickSht">
<div class="sht-body">
<h3>选择图片来源</h3>

<button class="sht-opt" onclick="openGal()">&#128444; 从相册选择</button>
<button class="sht-cancel" onclick="closeSheet()">取消</button>
</div>
</div>

<div class="campage" id="camPg">
<div class="cam-vid">
<video id="camVid" autoplay playsinline webkit-playsinline muted></video>
<div class="cam-flash" id="camFlash"></div>
<div class="cam-top">
<button onclick="closeCam()">&#10005;</button>
<div class="cam-info" id="camInfo"></div>
</div>
</div>
<div class="cam-bot"><button class="cam-snap" onclick="snap()"></button></div>
</div>

<div class="vwp" id="vwpPage">
<button class="vwp-x" onclick="closeVwp()">&#10005;</button>
<div class="vwp-ct" id="vwpCt"></div>
<img id="vwpImg" src="">
<div class="vwp-nav">
<button onclick="vwpNav(-1)">&#9664;</button>
<button onclick="vwpNav(1)">&#9654;</button>
</div>
</div>

<div class="mdl" id="cfmMdl">
<div class="mdl-box">
<div class="mdl-hd"><h3>确认导入</h3><button onclick="cancelImp()">&#215;</button></div>
<div class="mdl-bd">
<p>检测到已有验收数据</p>
<p><strong id="cfmName"></strong></p>
<p id="cfmProg"></p>
<div class="mdl-acts">
<button class="btn btn-gold btn-sm" onclick="doImp(true)">覆盖重新验收</button>
<button class="btn btn-gray btn-sm" onclick="cancelImp()">取消</button>
</div>
</div>
</div>
</div>

<div class="pdfp" id="pdfP">
<div class="pdfp-body" id="pdfBody"></div>

<button class="btn btn-gold btn-sm" onclick="sharePdf()">&#128228; 分享/转发</button>
<button class="btn btn-gray btn-sm" onclick="closePdf()">关闭</button>
</div>
</div>

<div class="ldbox" id="ldBox">
<div class="ldspin"></div>
<div class="ldtext" id="ldTxt">正在生成...</div>
</div>
<div class="tst" id="tstBox"></div>

<input type="file" id="galInput" accept="image/*" multiple
  style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none">

<script>
console.log("=== JF验收系统 v4.1 启动 ===");

var DBNAME="JFV41",STORE="ph",PKEY="pj";
var proj=null,cidx=-1,cstrm=null,pnd=null,pblob=null,vi=0,vph=[];
var IMG_MAX=1400,JPEG_Q=0.7;
var _galProc=false;

function odb(){return new Promise(function(ok,no){var r=indexedDB.open(DBNAME,2);r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};r.onsuccess=function(e){ok(e.target.result)};r.onerror=function(e){no(e.target.error)}})}
function dbPut(k,v,retries){retries=retries||2;return odb().then(function(db){return new Promise(function(ok,no){var t=db.transaction(STORE,"readwrite");t.objectStore(STORE).put(v,k);t.oncomplete=function(){ok(true)};t.onerror=function(e){no(e.target.error||t.error)};t.onabort=function(){no(t.error)}})}).catch(function(err){console.error("dbPut fail",k,err);if(retries>0)return new Promise(function(r){setTimeout(r,300)}).then(function(){return dbPut(k,v,retries-1)});return Promise.reject(err)})}
function dbGet(k){return odb().then(function(db){return new Promise(function(ok){var t=db.transaction(STORE,"readonly");var r=t.objectStore(STORE).get(k);r.onsuccess=function(){ok(r.result)};r.onerror=function(){ok(null)}})}).catch(function(){return null})}
function dbDel(k){return odb().then(function(db){db.transaction(STORE,"readwrite").objectStore(STORE).delete(k)}).catch(function(){})}

function sv(){
  if(!proj)return;
  var d={n:proj.n,t:proj.t,i:proj.i.map(function(x){
    return{s:x.s,n:x.n,n2:x.n2,oq:x.oq,op:x.op,ounit:x.ounit,oamount:x.oamount,q:x.q,p:x.p,
      aq:x.aq||"",ap:x.ap||"",aa:x.aa||"",rm:x.rm||"",
      ph:x.ph.map(function(y){return{d:y.d,l:y.l}}),d:x.d}
  })};

  h+='<th style="'+TH+'text-align:left;">\u62a5\u4ef7\u540d\u79f0<br/><span style="font-size:9.5px;font-weight:400;color:#666">(\u5185\u5bb9/\u89c4\u683c/\u5de5\u827a/\u5c3a\u5bf8/\u7528\u9014\u63cf\u8ff0)</span></th>';
  h+='<th style="'+TH+'width:56px;">\u9a8c\u6536\u6570\u91cf</th>';
  h+='<th style="'+TH+'width:50px;">\u9a8c\u6536\u5355\u4f4d</th>';
  h+='<th style="'+TH+'width:66px;">\u9a8c\u6536\u5355\u4ef7</th>';
  h+='<th style="'+TH+'width:78px;">\u9a8c\u6536\u91d1\u989d</th>';
  h+='<th style="'+TH+'min-width:200px;">\u9a8c\u6536\u7167\u7247</th>';
  h+='</tr></thead><tbody>';

  var totalAmount=0;
  for(var i=0;i<proj.i.length;i++){
    var it=proj.i[i];
    var bg=i%2===0?"#ffffff":"#f6f8fb";
    var aamt=parseFloat(it.aa)||0;
    totalAmount+=aamt;

    // 照片列：每张图片+独立水印文字
    var ph='';
    for(var j=0;j<it.ph.length;j++){
      var pp=it.ph[j];
      if(!pp.u)continue;
      ph+='<div style="display:inline-block;vertical-align:top;margin:3px;text-align:center;max-width:115px;">';
      ph+='<img src="'+pp.u+'" style="width:115px;max-height:82px;object-fit:contain;border:1px solid #c0c0c0;border-radius:2px;display:block;" />';
      var cap=pp.d||'';
      if(pp.l)cap+=' '+pp.l;
      if(cap){
        ph+='<div style="font-size:7.5px;color:#555;margin-top:2px;max-width:115px;word-break:break-all;line-height:1.25;">'+epdf(cap)+'</div>';
      }
      ph+='</div>';
    }

    var TD='border:1px solid #c0c8d0;padding:7px 8px;text-align:center;background:'+bg+';color:#222;';
    h+='<tr>';
    h+='<td style="'+TD+'font-weight:600;">'+it.n+'</td>';
    h+='<td style="'+TD+'text-align:left;font-size:11.5px;line-height:1.45;">'+epdf(it.n2)+'</td>';
    h+='<td style="'+TD+'">'+(it.aq||'-')+'</td>';
    h+='<td style="'+TD+'">'+epdf(it.ounit||'-')+'</td>';
    h+='<td style="'+TD+'">'+(it.ap?Number(it.ap).toLocaleString('zh'):'-')+'</td>';
    h+='<td style="'+TD+'font-weight:600;">'+(it.aa?Number(it.aa).toLocaleString('zh',{minimumFractionDigits:2,maximumFractionDigits:2}):'-')+'</td>';
    h+='<td style="border:1px solid #c0c8d0;padding:5px 6px;background:'+bg+';line-height:0;text-align:left;">'+(ph||'<span style="font-size:11px;color:#aaa;">-</span>')+'</td>';
    h+='</tr>';
  }

  // 合计行
  h+='<tr style="background:#e6edf5;">';
  h+='<td style="border:1px solid #a0b0c0;padding:10px 8px;text-align:center;font-weight:700;">\u5408\u8ba1</td>';
  for(var k=0;k<5;k++)h+='<td style="border:1px solid #a0b0c0;padding:6px;"></td>';
  h+='<td style="border:1px solid #a0b0c0;padding:10px 8px;text-align:center;font-weight:700;font-size:13px;">'+totalAmount.toLocaleString('zh',{minimumFractionDigits:2,maximumFractionDigits:2})+'</td>';
  h+='<td style="border:1px solid #a0b0c0;padding:6px;"></td>';
  h+='</tr>';

  h+='</tbody></table>';

  // ---- 签名区 ----
  h+='<div style="margin-top:32px;font-size:13px;'+SF+'">';
  h+='<div style="display:flex;gap:48px;margin-bottom:20px;">';
  h+='<span>\u9a8c\u6536\u4eba\uff1a____________________</span>';
  h+='<span>\u590d\u6838\u4eba\uff1a____________________</span>';
  h+='</div>';
  h+='<div>\u65e5\u671f\uff1a____________________\u5e74________\u6708________\u65e5</div>';
  h+='</div>';

  h+='</div>';

  ct.innerHTML=h;
  document.body.appendChild(ct);

  var imgs=ct.querySelectorAll("img");
  var lps=[];
  for(var i=0;i<imgs.length;i++){
    (function(img){
      if(img.complete&&img.naturalWidth>0)return;
      lps.push(new Promise(function(ok){img.onload=ok;img.onerror=ok;setTimeout(ok,8000)}));
    })(imgs[i]);
  }

  Promise.all(lps).then(function(){
    return new Promise(function(ok){setTimeout(ok,600)});
  }).then(function(){
    return html2canvas(ct,{scale:2,useCORS:true,logging:false,backgroundColor:"#fff",allowTaint:true});
  }).then(function(canvas){
    document.body.removeChild(ct);
    var jsP=window.jspdf.jsPDF;
    var id=canvas.toDataURL("image/jpeg",.92);
    var iw=canvas.width,ih=canvas.height;
    var pw=297,ph=210;
    var ratio=pw/(iw/2);
    var th=ih/2*ratio;
    var doc;
    if(th>ph){
      doc=new jsP({orientation:"landscape",unit:"mm",format:"a4"});
      var rem=th,yo=0;
      while(rem>0){
        if(yo>0)doc.addPage();
        var sy=yo/ratio*2,sh=Math.min(ph,rem)/ratio*2;
        var tc=document.createElement("canvas");
        tc.width=iw;tc.height=sh;
        tc.getContext("2d").drawImage(canvas,0,sy,iw,sh,0,0,iw,sh);
        doc.addImage(tc.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,sh/2*ratio);
        rem-=ph;yo+=ph;
      }
    }else{
      doc=new jsP({orientation:"landscape",unit:"mm",format:"a4"});
      doc.addImage(id,"JPEG",0,0,pw,th);
    }
    pblob=doc.output("blob");
    document.getElementById("pdfBody").innerHTML=h;
    document.getElementById("pdfP").classList.add("on");
    hideLd();msg("\u9a8c\u6536\u6587\u4ef6\u5df2\u751f\u6210");
  }).catch(function(e){
    try{document.body.removeChild(ct)}catch(ex){}
    hideLd();msg("\u751f\u6210\u5931\u8d25: "+(e.message||""));
    console.error(e);
  });
}

function dlPdf(){if(!pblob){msg("\u8bf7\u5148\u751f\u6210\u6587\u4ef6");return}var u=URL.createObjectURL(pblob);var a=document.createElement("a");a.href=u;a.download="\u9a8c\u6536\u5355_"+(proj?proj.n:"\u672a\u77e5")+".pdf";a.click();URL.revokeObjectURL(u);msg("\u5df2\u4e0b\u8f7d")}
function sharePdf(){if(!pblob){msg("\u8bf7\u5148\u751f\u6210\u6587\u4ef6");return}var fileName="\u9a8c\u6536\u5355_"+(proj?proj.n:"\u672a\u77e5")+".pdf";var file=new File([pblob],fileName,{type:"application/pdf"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({title:fileName,files:[file]}).catch(function(e){if(e.name!=="AbortError")dlPdf()})}else if(navigator.share){navigator.share({title:fileName,text:"\u8d39\u7528\u9a8c\u6536\u5355 - "+(proj?proj.n:"")}).catch(function(){})}else dlPdf()}
function closePdf(){document.getElementById("pdfP").classList.remove("on")}
function showLd(t){document.getElementById("ldTxt").textContent=t||"\u6b63\u5728\u5904\u7406...";document.getElementById("ldBox").classList.add("on")}
function hideLd(){document.getElementById("ldBox").classList.remove("on")}
var tmr=null;
function msg(m){var t=document.getElementById("tstBox");t.textContent=m;t.classList.add("on");clearTimeout(tmr);tmr=setTimeout(function(){t.classList.remove("on")},2500)}

window.addEventListener("beforeunload",function(){autoSave()});
document.addEventListener("visibilitychange",function(){if(document.hidden)autoSave()});
chkBtn();
console.log("=== 初始化完成 v4.1 ===");
</script>
