<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JF费用验收</title>
<script>
/* 多CDN容错加载器 —— 解决国内网络CDN不可达问题 */
!function(){
  function loadMultiple(urls){var i=0;!function next(){if(i>=urls.length)return;var s=document.createElement("script");s.src=urls[i++];s.onerror=next;document.head.appendChild(s)}()}
  loadMultiple(["https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js","https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"]);
  loadMultiple(["https://cdn.bootcdn.net/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"]);
  loadMultiple(["https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"]);
}()
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <!-- 顶部栏 -->
  <div class="topbar">
    <button class="back-btn" id="btnBack" onclick="goHome()" style="display:none">&#8592;</button>
    <h1 id="topTitle">JF费用验收</h1>
  </div>

  <!-- ===== 首页 ===== -->
  <div id="pgHome" class="page active">
    <div class="homebox">
      <div>
        <div class="icon">&#128203;</div>
        <h2 class="title">JF费用验收</h2>
        <p class="subtitle">按报价单逐项验收 · 多项目并行 · 不丢失进度</p>
      </div>
      <div class="project-list" id="projListArea"></div>
      <div class="btns">
        <button class="btn btn-gold" onclick="pickFile()">&#128229; 导入报价单</button>
        <p style="color:#4a4535;font-size:.72rem;text-align:center;">支持 .xlsx / .xls / .csv 格式</p>
      </div>
    </div>
  </div>

  <!-- ===== 验收列表页 ===== -->
  <div id="pgList" class="page">
    <div class="infobox"><div class="projname" id="projName"></div></div>
    <div class="progress-box">
      <div class="progress-row">
        <span class="progress-label">验收进度</span>
        <span class="progress-value" id="progVal">0/0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="item-list" id="itemList"></div>
    <div class="bottombar">
      <button class="btn btn-gold" id="btnGen" onclick="genPDF()" disabled>&#128196; 生成验收文件</button>
    </div>
  </div>

  <!-- ===== 全部完成页 ===== -->
  <div id="pgDone" class="page">
    <div class="done-page">
      <div class="done-icon">&#9989;</div>
      <h2>全部验收完毕</h2>
      <p>所有报价事项已完成验收</p>
      <div class="done-btns">
        <button class="btn btn-green" onclick="genPDF()">&#128196; 生成验收文件</button>
        <button class="btn btn-gray" onclick="goHome()">&#127968; 返回首页</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 验收详情页（浮层） ===== -->
<div class="detail-page" id="detailPage">
  <div class="detail-top">
    <button onclick="closeDetail()">&#8592;</button>
    <div class="detail-title" id="dtlTitle"></div>
  </div>
  <div class="detail-body">
    <!-- 报价信息（只读） -->
    <div class="form-group">
      <div class="form-group-title">&#128221; 报价信息（只读）</div>
      <div class="form-grid">
        <div class="form-field"><div class="form-field-label">报价数量</div><input type="text" id="inpOQ" readonly style="opacity:.6"></div>
        <div class="form-field"><div class="form-field-label">报价单价(元)</div><input type="text" id="inpOP" readonly style="opacity:.6"></div>
      </div>
      <div class="form-field" style="margin-top:10px"><div class="form-field-label">报价金额(元)</div><input type="text" id="inpOA" readonly style="opacity:.6"></div>
    </div>
    <!-- 验收信息（可修改） -->
    <div class="form-group">
      <div class="form-group-title">&#9989; 验收信息（可修改）</div>
      <div class="form-grid">
        <div class="form-field"><div class="form-field-label">验收数量</div><input type="number" id="inpAQ" inputmode="decimal" placeholder="输入实际数量"></div>
        <div class="form-field"><div class="form-field-label">验收单价(元)</div><input type="number" id="inpAP" inputmode="decimal" placeholder="输入实际单价"></div>
      </div>
      <div class="form-field" style="margin-top:10px">
        <div class="form-field-label">验收金额(元) <span class="form-field-orig" style="font-size:.65rem">= 数量 x 单价，可手动改</span></div>
        <input type="number" id="inpAA" inputmode="decimal" placeholder="自动计算或手动输入">
      </div>
      <div class="form-field" style="margin-top:10px"><div class="form-field-label">验收备注</div><input type="text" id="inpR" placeholder="输入备注信息"></div>
    </div>
    <!-- 验收照片 -->
    <div class="form-group">
      <div class="form-group-title" style="display:flex;justify-content:space-between">
        <span>&#128247; 验收照片</span>
        <span id="phCnt" style="font-weight:400;font-size:.72rem;color:#6e6858">0张</span>
      </div>
      <div style="margin-bottom:14px"><button class="btn btn-gold btn-sm" onclick="openSheet()" style="width:100%">&#128247; 选择图片</button></div>
      <div class="photo-grid" id="phGrid"></div>
    </div>
  </div>
  <div class="detail-footer">
    <div class="detail-footer-btns">
      <button class="btn btn-gray" onclick="saveOnly()">&#128190; 仅保存</button>
      <button class="btn btn-green" onclick="saveAccept()">&#9989; 保存并验收</button>
    </div>
  </div>
</div>

<!-- ===== 图片来源选择 ===== -->
<div class="sheet" id="pickSheet">
  <div class="sheet-body">
    <h3>选择图片来源</h3>
    <button class="sheet-option" onclick="openCamera()">&#128247; 拍照</button>
    <button class="sheet-option" onclick="openGallery()">&#128444; 从相册选择</button>
    <button class="sheet-cancel" onclick="closeSheet()">取消</button>
  </div>
</div>

<!-- ===== 相机页 ===== -->
<div class="camera-page" id="camPage">
  <div class="camera-view">
    <video id="camVid" autoplay playsinline webkit-playsinline muted></video>
    <div class="camera-flash" id="camFlash"></div>
    <div class="camera-top">
      <button onclick="stopCamera()">&#10005;</button>
      <div class="camera-info" id="camInfo"></div>
    </div>
  </div>
  <div class="camera-bottom">
    <button class="camera-snap" onclick="takeSnapshot()"></button>
  </div>
</div>

<!-- ===== 照片查看器 ===== -->
<div class="photo-viewer" id="viewerPage">
  <button class="photo-viewer-close" onclick="closeViewer()">&#10005;</button>
  <div class="photo-viewer-counter" id="viewerCt"></div>
  <img id="viewerImg" src="">
  <div class="photo-viewer-nav">
    <button onclick="viewerNavigate(-1)">&#9664;</button>
    <button onclick="viewerNavigate(1)">&#9654;</button>
  </div>
</div>

<!-- ===== 删除确认弹窗 ===== -->
<div class="modal" id="delModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>删除确认</h3>
      <button onclick="cancelDelete()">&#215;</button>
    </div>
    <div class="modal-body">
      <p>确定删除该项目？</p>
      <p><strong id="delProjName"></strong></p>
      <p style="color:#c05050;font-size:.8rem;">删除后数据无法恢复</p>
      <div class="modal-actions">
        <button class="btn btn-gray btn-sm" onclick="cancelDelete()">取消</button>
        <button class="btn btn-sm" style="background:#c05050;color:#fff" onclick="executeDelete()">确认删除</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== PDF 预览 ===== -->
<div class="pdf-preview" id="pdfPreview">
  <div class="pdf-preview-body" id="pdfBody"></div>
  <div class="pdf-preview-btns">
    <button class="btn btn-green btn-sm" onclick="downloadPdf()">&#128229; 下载PDF</button>
    <button class="btn btn-gold btn-sm" onclick="sharePdf()">&#128228; 分享/转发</button>
    <button class="btn btn-gray btn-sm" onclick="closePdfPreview()">关闭</button>
  </div>
</div>

<!-- ===== 加载动画 ===== -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">正在生成...</div>
</div>

<!-- ===== Toast 提示 ===== -->
<div class="toast" id="toastBox"></div>

<!-- 隐藏的相册文件选择器 -->
<input type="file" id="galInput" accept="image/*" multiple class="hidden-input">

<script src="app.js"></script>
</body>
</html>
